<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16173A"/><stop offset="1" stop-color="#06070F"/></linearGradient>
  <!-- the arms act like frosted glass: whatever is behind them is blurred -->
  <filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
  <mask id="arms" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <path d="M 702 300 L 386 512 L 702 724" fill="none" stroke="#fff" stroke-width="176" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<!-- solid layer: the stem of the K and the attendance dot -->
<rect x="234" y="212" width="176" height="600" rx="88.0" fill="#6E69FF"/>
<circle cx="676" cy="512" r="46" fill="#6E69FF"/>
<!-- glass layer: blurred copy of what's behind, then a translucent mint tint, then a soft sheen -->
<g mask="url(#arms)">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#frost)"><rect x="234" y="212" width="176" height="600" rx="88.0" fill="#6E69FF"/><circle cx="676" cy="512" r="46" fill="#6E69FF"/></g>
  <rect width="1024" height="1024" fill="#9FF0D6" fill-opacity="0.72"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
</g>
</svg>