<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF0FF"/></linearGradient>
  <filter id="frostK" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="frostO" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <mask id="armsMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <path d="M 648.8 247.4 L 421.3 400.0 L 648.8 552.6" fill="none" stroke="#fff" stroke-width="126.7" stroke-linecap="round" stroke-linejoin="round"/></mask>
  <mask id="oMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
