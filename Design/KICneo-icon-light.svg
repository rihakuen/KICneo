  <g filter="url(#frostO)"><rect x="311.8" y="184.0" width="126.7" height="432.0" rx="63.4" fill="#5A55F4"/><path d="M 342 800 V 744 A 40 40 0 0 1 422 744 V 800" fill="none" stroke="#5A55F4" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><path d="M 478 752 H 574 A 48 48 0 1 0 562.8 782.9" fill="none" stroke="#5A55F4" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect width="1024" height="1024" fill="#A6F2DA" fill-opacity="0.8"/>
